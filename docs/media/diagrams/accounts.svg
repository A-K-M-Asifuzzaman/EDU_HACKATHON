e="#1a1438" stroke-width="2.5"/><rect class="lit" style="--o:3.6s;--d:6.0s" x="860" y="130" width="300" height="120" rx="16" fill="#ffc23d"/><text x="1010.0" y="160" text-anchor="middle" class="t">4  Role check</text><text x="1010.0" y="183" text-anchor="middle" class="s">reader &lt; officer &lt; administrator</text><text x="1010.0" y="202" text-anchor="middle" class="s">elevated roles: verified email</text><text x="1010.0" y="221" text-anchor="middle" class="s">administrator: second factor</text><rect x="525" y="335" width="300" height="100" rx="16" fill="#1a1438"/><rect x="520" y="330" width="300" height="100" rx="16" fill="#dcf5ea" stroke="#1a1438" stroke-width="2.5"/><rect class="lit" style="--o:4.8s;--d:6.0s" x="520" y="330" width="300" height="100" rx="16" fill="#bdeed8"/><text x="670.0" y="360" text-anchor="middle" class="t">Officer</text><text x="670.0" y="383" text-anchor="middle" class="s">review alerts · draft plans</text><rect x="865" y="335" width="300" height="100" rx="16" fill="#1a1438"/><rect x="860" y="330" width="300" height="100" rx="16" fill="#dcf5ea" stroke="#1a1438" stroke-width="2.5"/><rect class="lit" style="--o:4.8s;--d:6.0s" x="860" y="330" width="300" height="100" rx="16" fill="#bdeed8"/><text x="1010.0" y="360" text-anchor="middle" class="t">Administrator</text><text x="1010.0" y="383" text-anchor="middle" class="s">roles · approve others&#x27; plans</text><rect x="45" y="335" width="400" height="100" rx="16" fill="#1a1438"/><rect x="40" y="330" width="400" height="100" rx="16" fill="#ffe3e4" stroke="#1a1438" stroke-width="2.5"/><text x="240.0" y="360" text-anchor="middle" class="t">Refused</text><text x="240.0" y="383" text-anchor="middle" class="s">401 no or invalid token · 403 wrong role</text><text x="240.0" y="402" text-anchor="middle" class="s">429 over 60 writes a minute</text><rect x="525" y="485" width="640" height="70" rx="16" fill="#1a1438"/><rect x="520" y="480" width="640" height="70" rx="16" fill="#ffffff" stroke="#1a1438" stroke-width="2.5"/><text x="840.0" y="510" text-anchor="middle" class="t">Audit log</text><text x="840.0" y="533" text-anchor="middle" class="s">sign-ins, role grants, reviews, plans and approvals</text><path d="M254 190 L294 190" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M254 190 L294 190"/></circle><path d="M504 190 L544 190" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite" path="M504 190 L544 190"/></circle><path d="M814 190 L854 190" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.2s" begin="-0.8s" repeatCount="indefinite" path="M814 190 L854 190"/></circle><path d="M1010 254 L1010 324" fill="none" stroke="#12936a" stroke-width="3" class="flow" marker-end="url(#ahe)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.0s" begin="-0.2s" repeatCount="indefinite" path="M1010 254 L1010 324"/></circle><path d="M900 254 Q860 290 690 324" fill="none" stroke="#12936a" stroke-width="3" class="flow" marker-end="url(#ahe)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.2s" begin="-0.6s" repeatCount="indefinite" path="M900 254 Q860 290 690 324"/></circle><path d="M680 254 Q560 300 444 350" fill="none" stroke="#f2545b" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#ahc)"/><path d="M670 434 L670 474" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><path d="M1010 434 L1010 474" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><text x="40" y="600" text-anchor="start" class="s">Every check runs on the server for every protected request. Public forecasting never needs an account.</text>
</svg>