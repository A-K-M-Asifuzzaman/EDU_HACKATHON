<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="Deployment: the browser loads the static dashboard from Vercel, which proxies /api requests to the FastAPI backend on a Hugging Face Space; map tiles come from MapTiler, sign-in from Firebase, and optional APIs are called by the backend">
<title>Deployment: the browser loads the static dashboard from Vercel, which proxies /api requests to the FastAPI backend on a Hugging Face Space; map tiles come from MapTiler, sign-in from Firebase, and optional APIs are called by the backend</title>
<defs><marker id="ahi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1438"/></marker><marker id="ahv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a45f0"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2545b"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1597c9"/></marker><marker id="ahe" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12936a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8860b"/></marker>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#ffe3e4"/><line x1="0" y1="0" x2="0" y2="9" stroke="#f2545b" stroke-width="3"/></pattern>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1a1438; }
.t { font-size: 17px; font-weight: 800; } .s { font-size: 13px; fill: #4a4370; } .m { font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4a4370; }
.eb { font-size: 13px; font-weight: 700; letter-spacing: .08em; fill: #6a45f0; } .h { font-size: 26px; font-weight: 800; } .lb { font-size: 12.5px; font-weight: 700; }
.flow { stroke-dasharray: 9 8; animation: flow 1.1s linear infinite; } @keyframes flow { to { stroke-dashoffset: -17; } }
.lit { opacity: 0; animation: lit var(--d, 6s) ease-in-out infinite; animation-delay: var(--o, 0s); }
@keyframes lit { 0%, 100% { opacity: 0; } 6%, 18% { opacity: 1; } 26% { opacity: 0; } }
.pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pulse { 50% { transform: scale(1.08); } }
.sweep { animation: sweep 7.2s linear infinite; } @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(var(--sx)); } }
@media (prefers-reduced-motion: reduce) { .flow, .lit, .pulse, .sweep { animation: none; } .lit { opacity: 0; } .dot { display: none; } }
</style></defs>
<rect x="1.5" y="1.5" width="1197" height="447" rx="22" fill="#faf6ee" stroke="#1a1438" stroke-width="3"/>
<text x="36" y="44" class="eb">PRODUCTION ARCHITECTURE</text><text x="36" y="76" class="h">Two hosts, one origin for the browser</text>
