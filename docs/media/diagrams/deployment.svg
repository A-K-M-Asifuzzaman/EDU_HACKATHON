 text-anchor="middle" class="s">when configured</text><path d="M254 186 L344 186" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M254 186 L344 186"/></circle><path d="M604 186 L694 186" fill="none" stroke="#6a45f0" stroke-width="3" class="flow" marker-end="url(#ahv)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite" path="M604 186 L694 186"/></circle><text x="650" y="140" text-anchor="middle" class="m">/api/* proxy</text><path d="M694 214 L604 214" fill="none" stroke="#12936a" stroke-width="3" class="flow" marker-end="url(#ahe)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.6s" begin="-0.2s" repeatCount="indefinite" path="M694 214 L604 214"/></circle><path d="M344 214 L254 214" fill="none" stroke="#12936a" stroke-width="3" class="flow" marker-end="url(#ahe)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.6s" begin="-1.0s" repeatCount="indefinite" path="M344 214 L254 214"/></circle><path d="M964 198 L994 198" fill="none" stroke="#f2545b" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#ahc)"/><path d="M150 250 L150 324" fill="none" stroke="#1597c9" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#ahr)"/><path d="M254 280 Q300 300 344 350" fill="none" stroke="#f2545b" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#ahc)"/><path d="M830 250 Q830 370 606 380" fill="none" stroke="#f2545b" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#ahc)"/><text x="846" y="316" text-anchor="start" class="s">verifies sign-in tokens</text><text x="846" y="335" text-anchor="start" class="s">with Google&#x27;s public keys</text>
