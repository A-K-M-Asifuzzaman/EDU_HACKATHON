<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#ffe3e4"/><line x1="0" y1="0" x2="0" y2="9" stroke="#f2545b" stroke-width="3"/></pattern>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1a1438; }
.t { font-size: 17px; font-weight: 800; } .s { font-size: 13px; fill: #4a4370; } .m { font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #4a4370; }
.eb { font-size: 13px; font-weight: 700; letter-spacing: .08em; fill: #6a45f0; } .h { font-size: 26px; font-weight: 800; } .lb { font-size: 12.5px; font-weight: 700; }
.flow { stroke-dasharray: 9 8; animation: flow 1.1s linear infinite; } @keyframes flow { to { stroke-dashoffset: -17; } }
.lit { opacity: 0; animation: lit var(--d, 6s) ease-in-out infinite; animation-delay: var(--o, 0s); }
@keyframes lit { 0%, 100% { opacity: 0; } 6%, 18% { opacity: 1; } 26% { opacity: 0; } }
.pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes pulse { 50% { transform: scale(1.08); } }
.sweep { animation: sweep 7.2s linear infinite; } @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(var(--sx)); } }
@media (prefers-reduced-motion: reduce) { .flow, .lit, .pulse, .sweep { animation: none; } .lit { opacity: 0; } .dot { display: none; } }
</style></defs>
