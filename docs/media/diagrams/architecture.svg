<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Architecture: the verified organizer CSV feeds a 24-feature pipeline; offline training with season-level cross-validation produces an 11 KB model bundle and 53,100 replay forecasts; a FastAPI backend serves them to a static Next.js dashboard; optional services are never model inputs">
<title>Architecture: the verified organizer CSV feeds a 24-feature pipeline; offline training with season-level cross-validation produces an 11 KB model bundle and 53,100 replay forecasts; a FastAPI backend serves them to a static Next.js dashboard; optional services are never model inputs</title>
