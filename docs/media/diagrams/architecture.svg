="330" text-anchor="middle" class="t">Model bundle (~11 KB)</text><text x="990.0" y="353" text-anchor="middle" class="m">models/dengueshield_B.joblib</text><text x="990.0" y="372" text-anchor="middle" class="s">+ replay.csv.gz: 53,100 forecasts</text><rect x="455" y="305" width="300" height="112" rx="16" fill="#1a1438"/><rect x="450" y="300" width="300" height="112" rx="16" fill="#ffffff" stroke="#1a1438" stroke-width="2.5"/><rect class="lit" style="--o:4.8s;--d:7.2s" x="450" y="300" width="300" height="112" rx="16" fill="#ffc23d"/><text x="600.0" y="330" text-anchor="middle" class="t">FastAPI backend</text><text x="600.0" y="353" text-anchor="middle" class="m">/api/* endpoints</text><text x="600.0" y="372" text-anchor="middle" class="s">cached inference · auth · audit</text><rect x="60" y="300" width="300" height="112" rx="16" fill="#ffffff" stroke="#1a1438" stroke-width="2.5" stroke-dasharray="7 6"/><text x="210.0" y="330" text-anchor="middle" class="t">Optional services</text><text x="210.0" y="353" text-anchor="middle" class="s">NASA POWER · Open-Meteo</text><text x="210.0" y="372" text-anchor="middle" class="s">OpenAI · DGHS GIS · Firebase</text><text x="210.0" y="391" text-anchor="middle" class="s">never model inputs</text><rect x="305" y="493" width="600" height="104" rx="16" fill="#1a1438"/><rect x="300" y="488" width="600" height="104" rx="16" fill="#dcf5ea" stroke="#1a1438" stroke-width="2.5"/><rect class="lit" style="--o:6.0s;--d:7.2s" x="300" y="488" width="600" height="104" rx="16" fill="#bdeed8"/><text x="600.0" y="518" text-anchor="middle" class="t">Next.js static dashboard</text><text x="600.0" y="541" text-anchor="middle" class="s">React 19 · TypeScript · Tailwind 4 · ECharts · MapLibre</text><text x="600.0" y="560" text-anchor="middle" class="s">served by FastAPI on the same origin (no CORS)</text><path d="M364 164 L444 164" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M364 164 L444 164"/></circle><text x="404" y="152" text-anchor="middle" class="s">fetch</text><path d="M754 164 L834 164" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.2s" begin="-0.3s" repeatCount="indefinite" path="M754 164 L834 164"/></circle><path d="M990 232 L990 294" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.0s" begin="-0.6s" repeatCount="indefinite" path="M990 232 L990 294"/></circle><path d="M836 356 L756 356" fill="none" stroke="#1a1438" stroke-width="3" class="flow" marker-end="url(#ahi)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.2s" begin="-0.8s" repeatCount="indefinite" path="M836 356 L756 356"/></circle><path d="M600 220 L600 294" fill="none" stroke="#6a45f0" stroke-width="3" class="flow" marker-end="url(#ahv)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.2s" begin="-0.2s" repeatCount="indefinite" path="M600 220 L600 294"/></circle><text x="612" y="262" text-anchor="start" class="s">features at request time</text><path d="M364 356 L444 356" fill="none" stroke="#f2545b" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#ahc)"/><path d="M600 416 L600 482" fill="none" stroke="#12936a" stroke-width="3" class="flow" marker-end="url(#ahe)"/><circle class="dot" r="6.5" fill="#ffc23d" stroke="#1a1438" stroke-width="2"><animateMotion dur="1.0s" begin="-0.4s" repeatCount="indefinite" path="M600 416 L600 482"/></circle>
