# Render Blueprint: BACKEND only. The dashboard is a static Next.js site on Vercel that proxies /api/* to this service (see vercel.json).
services:
  - type: web
    name: dengueshield-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter            # always on (~$7/month). The free plan sleeps after 15 min idle and cold-starts in about a minute.
    region: singapore        # closest to Bangladesh
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY        # Copilot. Backend-only; remove the variable to turn the Copilot off (retrieval-only fallback).
        sync: false
      - key: ACCESS_PASSWORD       # team password (HTTP Basic, any username) for everything except /api/health
        sync: false
      - key: OPENAI_BUDGET_USD     # in-memory spend guard (resets on restart); also set a hard monthly limit in the OpenAI dashboard
        value: "1.0"
