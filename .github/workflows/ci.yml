name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-research.txt
      - name: Fetch the organizer dataset (checksum-verified)
        run: python scripts/fetch_data.py
      - name: Run tests (leakage, models, A* vs Dijkstra, decision tools, API)
        run: python -m pytest tests -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          # This build is only used by the browser tests below (Deploy builds separately on Vercel). Placeholders, not credentials:
          # an offline Firebase demo project (no network calls until someone signs in) and a dummy MapTiler key whose style, tile and
          # geocoding requests the tests answer locally (frontend/tests/e2e/fixtures.ts).
          NEXT_PUBLIC_FIREBASE_API_KEY: e2e-placeholder-not-a-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-dengueshield-e2e.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-dengueshield-e2e
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:e2e"
          NEXT_PUBLIC_MAPTILER_KEY: e2e-placeholder-not-a-key
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 3

  e2e:
    name: Browser tests (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start the app (API serves the built dashboard)
        env:
          FIREBASE_PROJECT_ID: demo-dengueshield-e2e          # accounts switched on against the demo project: protected routes answer 401
        run: |
          nohup python -m uvicorn dengueshield.api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/api/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/api/health
      - run: npx playwright test --retries=1
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            api.log
          retention-days: 7

  killswitch:
    name: Offline kill-switch (no internet)
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch the organizer datasets (online, as in scripts/setup.sh)
        run: python scripts/fetch_data.py
      - uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Online baseline (same build, normal network)
        run: |
          nohup python -m uvicorn dengueshield.api.main:app --host 127.0.0.1 --port 8000 > baseline_api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/api/health >/dev/null && break; sleep 2; done
          mkdir -p killswitch
          python scripts/offline_verify.py --base http://127.0.0.1:8000 --write killswitch/baseline.json
          pkill -f "uvicorn dengueshield" || true
      - name: Kill switch (private network namespace, loopback only)
        run: PYBIN="$(which python)" PORT=8765 bash scripts/killswitch.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: killswitch-evidence
          path: |
            killswitch
            baseline_api.log
          retention-days: 14
